{
  "name": "Local Codex harness checks",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "regression": {
      "strategy": {
        "matrix": {
          "os": [
            "windows-latest",
            "ubuntu-24.04"
          ]
        }
      },
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Verify exact source",
          "run": "python -c \"import os, subprocess; assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() == os.environ['GITHUB_SHA']\""
        },
        {
          "name": "Verify native pack",
          "run": "python -X utf8 -I scripts/codex-local.py verify-source"
        },
        {
          "name": "Native regression tests",
          "run": "python -X utf8 -I scripts/tests/test_local.py"
        }
      ]
    }
  }
}
